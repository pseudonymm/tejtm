[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tejtm"
version = "0.1.0"
description = "Schema mapping with composite confidence for tabular imports"
readme = "writeups/README.md"
requires-python = ">=3.11"
dependencies = [
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.4"]
phone = ["phonenumbers>=8.13"]
yaml = ["pyyaml>=6"]
pydantic = ["pydantic>=2.0", "email-validator>=2.0"]
dev = [
  "pytest>=8.0",
  "pydantic>=2.0",
  "email-validator>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tejtm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
